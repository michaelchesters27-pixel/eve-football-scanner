# Ref Watch production deploy trigger — 2026-09-02
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public Supabase configuration is intentionally present in the frontend bundle.
  # Keep server-only secrets such as SUPABASE_SERVICE_ROLE_KEY and ODDS_API_KEY scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
