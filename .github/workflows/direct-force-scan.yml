name: EVE hourly direct scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    paths:
      - '.github/workflows/direct-force-scan.yml'
      - 'scripts/direct-stage.ts'
      - 'netlify/functions/pre-model-safety.ts'
      - 'netlify/functions/sync-matchday-context-safe.ts'
      - 'netlify/functions/canonicalize-fotmob-referees.ts'
      - 'netlify/functions/reconcile-referees-uncapped.ts'
      - 'netlify/functions/run-scanner.ts'
      - 'netlify/functions/run-scanner-safe.ts'
      - 'netlify/functions/run-expanded-markets.ts'
      - 'netlify/functions/run-expanded-markets-safe.ts'
      - 'netlify/functions/refine-referee-intelligence.ts'
      - 'netlify/functions/refine-referee-intelligence-uncapped.ts'
      - 'netlify/functions/apply-calibration.ts'
      - 'netlify/functions/apply-expanded-calibration.ts'
      - 'netlify/functions/publish-calibrated-surfaces.ts'
      - 'netlify/functions/run-combos-safe.ts'
      - 'netlify/functions/system-hard-audit.ts'
      - 'netlify/functions/_shared/fotmob-referee-profile.ts'
      - 'netlify/functions/_shared/referee-reconcile.ts'

concurrency:
  group: eve-hourly-direct-scan
  cancel-in-progress: true

env:
  SUPABASE_URL: https://hfmaofmvsmqbxgrwrjqf.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  fixture-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Verify Supabase credentials
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Refresh fixtures
        env: { EVE_STAGE: fixtures }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  primary-match-intelligence:
    needs: fixture-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Import match intelligence and sanitize immediately
        env: { EVE_STAGE: match-intel }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  referee-enrichment:
    needs: primary-match-intelligence
    if: ${{ always() && needs.primary-match-intelligence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - id: canonical
        name: Preserve exact FotMob referee IDs and stats
        continue-on-error: true
        env: { EVE_STAGE: canonical-ref }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts
      - id: fallback
        name: Second-source referee fallback
        if: always()
        continue-on-error: true
        env: { EVE_STAGE: ref-fallback }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts
      - id: reconcile
        name: Reconcile confirmed referee profiles without caps
        if: always()
        continue-on-error: true
        env: { EVE_STAGE: ref-reconcile }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts
      - name: Mark referee enrichment health
        if: always()
        shell: bash
        run: |
          echo "canonical=${{ steps.canonical.outcome }} fallback=${{ steps.fallback.outcome }} reconcile=${{ steps.reconcile.outcome }}"
          if [[ "${{ steps.canonical.outcome }}" != "success" || "${{ steps.fallback.outcome }}" != "success" || "${{ steps.reconcile.outcome }}" != "success" ]]; then
            echo "Referee enrichment is partial. Publication paths remain independent and fail closed on unavailable referee intelligence."
            exit 1
          fi

  pre-model-safety:
    needs: [fixture-refresh, primary-match-intelligence]
    if: ${{ always() && needs.fixture-refresh.result == 'success' && needs.primary-match-intelligence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Enforce referee and official-lineup invariants
        env: { EVE_STAGE: safety }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  core-model:
    needs: pre-model-safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Stage Best Bets model output
        env: { EVE_STAGE: core }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  expanded-model:
    needs: pre-model-safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Stage Market Lab model output
        env: { EVE_STAGE: expanded }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  core-referee-intelligence:
    needs: core-model
    if: ${{ always() && needs.core-model.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Apply confirmed referee intelligence to Best Bets only
        env:
          EVE_STAGE: refine-ref
          EVE_MODEL_VERSION: v0-research
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  expanded-referee-intelligence:
    needs: expanded-model
    if: ${{ always() && needs.expanded-model.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Apply confirmed referee intelligence to Market Lab only
        env:
          EVE_STAGE: refine-ref
          EVE_MODEL_VERSION: v1-expanded-research
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  core-calibration:
    needs: [core-model, core-referee-intelligence]
    if: ${{ always() && needs.core-model.result == 'success' && needs.core-referee-intelligence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Calibrate Best Bets
        env: { EVE_STAGE: cal-core }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  expanded-calibration:
    needs: [expanded-model, expanded-referee-intelligence]
    if: ${{ always() && needs.expanded-model.result == 'success' && needs.expanded-referee-intelligence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Calibrate Market Lab
        env: { EVE_STAGE: cal-expanded }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  core-publication:
    needs: core-calibration
    if: ${{ always() && needs.core-calibration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Atomically replace public Best Bets with the completed calibrated set
        env:
          EVE_STAGE: publish
          EVE_PUBLICATION_SURFACE: core
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  expanded-publication:
    needs: expanded-calibration
    if: ${{ always() && needs.expanded-calibration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Atomically replace public Market Lab with the completed calibrated set
        env:
          EVE_STAGE: publish
          EVE_PUBLICATION_SURFACE: expanded
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  combo-lab:
    needs: [core-publication, expanded-publication]
    if: ${{ always() && needs.core-publication.result == 'success' && needs.expanded-publication.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Rebuild Combo Lab from fresh calibrated predictions
        env: { EVE_STAGE: combos }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts

  final-audit:
    needs: [fixture-refresh, primary-match-intelligence, referee-enrichment, pre-model-safety, core-publication, expanded-publication, combo-lab]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: Run seven-day uncapped hard invariant audit
        if: ${{ needs.fixture-refresh.result == 'success' && needs.pre-model-safety.result == 'success' }}
        env: { EVE_STAGE: audit }
        run: npx --yes tsx@4.20.5 scripts/direct-stage.ts
      - name: Assert public scanner pipeline completed
        if: always()
        shell: bash
        run: |
          echo "fixture=${{ needs.fixture-refresh.result }} primary=${{ needs.primary-match-intelligence.result }} refEnrichment=${{ needs.referee-enrichment.result }} safety=${{ needs.pre-model-safety.result }} corePublish=${{ needs.core-publication.result }} expandedPublish=${{ needs.expanded-publication.result }} combo=${{ needs.combo-lab.result }}"
          test "${{ needs.fixture-refresh.result }}" = "success"
          test "${{ needs.primary-match-intelligence.result }}" = "success"
          test "${{ needs.pre-model-safety.result }}" = "success"
          test "${{ needs.core-publication.result }}" = "success"
          test "${{ needs.expanded-publication.result }}" = "success"
          test "${{ needs.combo-lab.result }}" = "success"
