name: EVE direct force scan

on:
  push:
    paths:
      - '.github/workflows/direct-force-scan.yml'
  workflow_dispatch:

jobs:
  force-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://hfmaofmvsmqbxgrwrjqf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Checkout EVE
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify direct-scan credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo 'MISSING_SECRET: SUPABASE_SERVICE_ROLE_KEY'; exit 2; fi
          if [ -z "$ODDS_API_KEY" ]; then echo 'INFO: ODDS_API_KEY not set in GitHub; price refresh will be skipped.'; fi
          echo 'Direct scan credentials available.'

      - name: Force full EVE scan without Netlify
        run: npx --yes tsx@4.20.5 scripts/force-hourly-scan.ts
