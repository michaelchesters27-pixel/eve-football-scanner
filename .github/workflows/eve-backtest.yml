name: EVE Football Backtest

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Netlify deploy
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code=$(curl -sS -o /tmp/status.json -w '%{http_code}' 'https://hackysfootyscanner.netlify.app/.netlify/functions/backtest-status' || true)
            if [ "$code" = "200" ]; then
              echo "Netlify backtest endpoints are live"
              cat /tmp/status.json
              exit 0
            fi
            echo "Waiting for deploy ($i/40), HTTP $code"
            sleep 10
          done
          echo "Netlify deployment did not expose backtest-status in time"
          exit 1

      - name: Start background backtest
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/start.txt -w '%{http_code}' 'https://hackysfootyscanner.netlify.app/.netlify/functions/backtest-now-background' || true)
          echo "Start HTTP $code"
          cat /tmp/start.txt || true
          if [ "$code" != "202" ] && [ "$code" != "200" ]; then exit 1; fi

      - name: Wait for backtest result
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            curl -fsS 'https://hackysfootyscanner.netlify.app/.netlify/functions/backtest-status' -o /tmp/result.json
            python - <<'PY'
          import json
          p='/tmp/result.json'
          d=json.load(open(p))
          run=d.get('run') or {}
          print('STATUS', run.get('status', d.get('status')))
          print(json.dumps(d, separators=(',',':'))[:12000])
          PY
            status=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          print((d.get('run') or {}).get('status', d.get('status','')))
          PY
          )
            if [ "$status" = "success" ]; then
              echo 'BACKTEST_COMPLETE'
              cat /tmp/result.json
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo 'BACKTEST_FAILED'
              cat /tmp/result.json
              exit 1
            fi
            sleep 30
          done
          echo 'Backtest did not finish within polling window'
          cat /tmp/result.json || true
          exit 1
